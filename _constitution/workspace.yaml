vision: 'Personal fork of LosslessCut — an AI-assisted video clip factory for gaming
  and streaming content. RestAI acts as the brain (video intelligence, AI segment
  generation, automated pipeline) while LosslessCut acts as the hands (lossless FFmpeg-based
  cutting and export). Goal: drop a raw stream VOD in, get highlight clips out.

  Source: https://github.com/mifi/lossless-cut | License: GPL-2.0

  '
brief: 'AI-assisted video clip factory for gaming/streaming. Onboarding complete (3/3).
  Next: build RestAI control layer to drive LosslessCut via subprocess + HTTP API.'
